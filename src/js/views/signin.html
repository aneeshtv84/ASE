    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="logo-section">
                <div class="demo-icon-1place"></div>
                <div class="logo-text">MigDB for Sybase ASE</div>
            </div>

            <div class="welcome-text">
                <h1>
                    <span class="highlight">Welcome to the</span>
                    <span class="highlight">Future of Enterprise</span>
                    <span class="highlight">Database Migrations</span>
                </h1>
            </div>

           <div class="features" data-bind="foreach: features">
                <div class="feature-item">
                    <i class="feature-icon" data-bind="css: iconClass"></i>
                    <div class="feature-content">
                        <span class="feature-text" data-bind="text: title"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section - White Background -->
        <div class="right-section">
            <div class="signin-card">
                <h2>Sign In</h2>
                <p>Enter your Secrets to access your account</p>
                <oj-validation-group id="tracker" valid="{{groupValid}}">
                    <oj-form-layout class="oj-formlayout-full-width">
        <!-- Email Input -->

       
         <oj-input-text required id='OnePlaceUsername' label-hint="User Name" placeholder='User Name' spellcheck='false' aria-label='User Name' value='{{OnePlaceuserName}}' required='true'>
         <span slot="start">
          <i class="fas fa-user" style="color:#2563EB; font-size:18px; margin-right:6px;"></i>
         </span>
         </oj-input-text>


        <!-- Password Input -->
        <oj-input-password
          id="password"
          label-hint="Password"
          placeholder="Enter your password"
          value="{{OnePlacepassWord}}"
          mask-icon="visible"
          required
          class="oj-complete">
          <span slot="start"><i class="fas fa-lock" style="color:#2563EB; font-size:18px; margin-right:6px;"></i></span>
        </oj-input-password>

        <!-- Remember Me & Forgot Password -->
          


        <!-- Submit Button -->
                         <oj-button id='signInBtn' class="signin-button"   label="Sign In" chroming="callToAction"
                  on-oj-action='[[signIn]]'>s</oj-button>

      </oj-form-layout>
</oj-validation-group>
            </div>
        </div>
    </div>




<oj-dialog id="signInProgress" title="Authenticating...." modality="modeless"
style="display:none;width:350px;min-width:240px;max-width:450px;">
<div slot="body">
<oj-progress-circle  id="createbar" value="-1" >
</oj-progress-circle >
</div>
</oj-dialog>

<oj-dialog id="TimeoutSign" dialog-title="There is a technical issue. Please try again later" modality="modeless"
style="display:none;width:350px;min-width:240px;max-width:450px;" cancel-behavior="[[CancelBehaviorOpt]]">
    <div slot="body">
        
    </div>
</oj-dialog>

              <oj-dialog id="LoginErrDialog" dialog-title="Login Error" style="display:none;width:500px;min-width:500px;max-width:500px;">
       <div slot="body">
           <oj-bind-for-each data="[[LoginErr]]">
               <template data-oj-as="LoginMsg">
                   <br>
                   <oj-bind-text value='[[LoginMsg.data]]'></oj-bind-text>
               </template>
           </oj-bind-for-each>
       </div>
       <div slot="footer">
           <oj-button id="okdelButton" on-oj-action="[[LoginMsgOKClose]]">
               OK
           </oj-button>
       </div>
   </oj-dialog>
