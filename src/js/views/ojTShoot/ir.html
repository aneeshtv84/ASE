<!-- 1. Inputs -->
<div class="oj-panel">
  <oj-form-layout id="fl2" class="oj-form-layout" label-edge="inside" max-columns="4" direction="row">
    <oj-select-single id="Database" label-hint="Target Database (alias)" data="[[DBDetDP]]"
        value="{{currentDB}}" on-value-changed="[[valueChangedHandler]]">
    </oj-select-single>
    <!-- <oj-input-text label-hint="Replicat Name (optional)" value="{{repName}}"></oj-input-text>
    <oj-input-text label-hint="Checkpoint Table (optional, e.g. dbo.ckpt)" value="{{chkptTbl}}"></oj-input-text> -->
    <oj-button id="IRTShootBtn" chroming="callToAction" disabled="[[ButtonVal]]" on-oj-action="[[IRTShoot]]">
      Get Details
    </oj-button>
  </oj-form-layout>
</div>

<oj-bind-if test="[[loaded]]">

  <!-- 2. Summary cards -->
  <div class="oj-flex oj-sm-margin-2x-vertical">
    <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(repSessionCount() ? 'ok' : 'warn')]]">
      <div class="oj-typography-body-sm oj-text-color-secondary">Replicat Sessions</div>
      <div class="oj-typography-heading-sm"><oj-bind-text value="[[repSessionCount]]"></oj-bind-text></div>
    </div>
    <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(repOpenTxnCount() ? 'warn' : 'ok')]]">
      <div class="oj-typography-body-sm oj-text-color-secondary">Open Replicat Txns</div>
      <div class="oj-typography-heading-sm"><oj-bind-text value="[[repOpenTxnCount]]"></oj-bind-text></div>
    </div>
    <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(logLevel())]]">
      <div class="oj-typography-body-sm oj-text-color-secondary">Log Used</div>
      <div class="oj-typography-heading-sm"><oj-bind-text value="[[logUsedPct() + ' %']]"></oj-bind-text></div>
    </div>
    <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(blockingCount() ? 'bad' : 'ok')]]">
      <div class="oj-typography-body-sm oj-text-color-secondary">Blocking Sessions</div>
      <div class="oj-typography-heading-sm"><oj-bind-text value="[[blockingCount]]"></oj-bind-text></div>
    </div>
    <div :class="[['oj-panel oj-flex-item ' + cardClass(noUniqueCount() ? 'warn' : 'ok')]]">
      <div class="oj-typography-body-sm oj-text-color-secondary">Tables Without Unique Key</div>
      <div class="oj-typography-heading-sm"><oj-bind-text value="[[noUniqueCount]]"></oj-bind-text></div>
    </div>
  </div>

  <!-- 3. Sections that could not be collected -->
  <oj-bind-if test="[[sectionErrors().length > 0]]">
    <div class="oj-panel oj-bg-warning-10 oj-sm-margin-2x-bottom">
      <div class="oj-typography-subheading-xs">Some sections could not be collected</div>
      <oj-bind-for-each data="[[sectionErrors]]">
        <template>
          <div class="oj-typography-body-sm">
            <b><oj-bind-text value="[[$current.data.section]]"></oj-bind-text>:</b>
            <oj-bind-text value="[[$current.data.message]]"></oj-bind-text>
          </div>
        </template>
      </oj-bind-for-each>
    </div>
  </oj-bind-if>

  <!-- 4. Groups (collapsible, like the old page) -->
  <oj-bind-for-each data="[[groups]]">
    <template data-oj-as="grp">
      <oj-collapsible expanded="true">
        <h6 slot="header" class="oj-header-border"><oj-bind-text value="[[grp.data.title]]"></oj-bind-text></h6>

        <oj-bind-for-each data="[[grp.data.sections]]">
          <template data-oj-as="sec">
            <div class="oj-panel io-color oj-margin" style="width:100%;">
              <h7><oj-bind-text value="[[sec.data.title]]"></oj-bind-text></h7>
              <oj-bind-if test="[[sec.data.hint]]">
                <span class="tooltip fa fa-info-circle">
                  <span class="tooltiptext"><oj-bind-text value="[[sec.data.hint]]"></oj-bind-text></span>
                </span>
              </oj-bind-if>
            </div>

            <oj-bind-if test="[[sec.data.error()]]">
              <div class="oj-typography-body-sm oj-text-color-warning oj-sm-margin-2x-bottom">
                <oj-bind-text value="[[sec.data.error]]"></oj-bind-text>
              </div>
            </oj-bind-if>

            <oj-bind-if test="[[!sec.data.error() && sec.data.rows().length === 0]]">
              <div class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-bottom">No rows.</div>
            </oj-bind-if>

            <oj-bind-if test="[[sec.data.rows().length > 0]]">
              <oj-table :aria-label="[[sec.data.title]]" data="[[sec.data.dp]]"
                  columns="[[sec.data.columns]]" display="grid" scroll-policy="loadAll"
                  selection-mode='{"row": "single"}' class="oj-sm-width-full"
                  style="max-height:45vh;">
              </oj-table>
            </oj-bind-if>
          </template>
        </oj-bind-for-each>
      </oj-collapsible>
    </template>
  </oj-bind-for-each>

</oj-bind-if>
