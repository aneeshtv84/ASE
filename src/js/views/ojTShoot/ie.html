<div id="parentDiv">

  <!-- 1. Database picker (kept, simplified) -->
  <div class="oj-panel">
    <oj-form-layout id="fl2" class="oj-form-layout" label-edge="start" max-columns="2" direction="row">
      <oj-label for="Database">Database Name</oj-label>
      <oj-select-single id="Database" label-hint="Choose Source Database" label-edge="inside"
          data="[[DBDetDP]]" value="{{currentDB}}" on-value-changed="[[valueChangedHandler]]">
      </oj-select-single>
      <oj-button id="IETShootBtn" chroming="callToAction" disabled="[[ButtonVal]]"
          on-oj-action="[[IETShoot]]">
        Get Details
      </oj-button>
    </oj-form-layout>
  </div>

  <oj-bind-if test="[[loaded]]">

    <!-- 2. Summary cards (new) -->
    <div class="oj-flex oj-sm-margin-2x-vertical">
      <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(truncLevel())]]">
        <div class="oj-typography-body-sm oj-text-color-secondary">Secondary Truncation Point</div>
        <div class="oj-typography-heading-sm"><oj-bind-text value="[[truncStatus]]"></oj-bind-text></div>
      </div>
      <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(logLevel())]]">
        <div class="oj-typography-body-sm oj-text-color-secondary">Log Used</div>
        <div class="oj-typography-heading-sm"><oj-bind-text value="[[logUsedPct() + ' %']]"></oj-bind-text></div>
      </div>
      <div class="oj-panel oj-flex-item oj-sm-margin-2x-end">
        <div class="oj-typography-body-sm oj-text-color-secondary">Replicated Tables</div>
        <div class="oj-typography-heading-sm"><oj-bind-text value="[[repTablesSummary]]"></oj-bind-text></div>
      </div>
      <div :class="[['oj-panel oj-flex-item oj-sm-margin-2x-end ' + cardClass(blockingCount() ? 'bad' : 'ok')]]">
        <div class="oj-typography-body-sm oj-text-color-secondary">Blocking Sessions</div>
        <div class="oj-typography-heading-sm"><oj-bind-text value="[[blockingCount]]"></oj-bind-text></div>
      </div>
      <div :class="[['oj-panel oj-flex-item ' + cardClass(longRunCount() ? 'warn' : 'ok')]]">
        <div class="oj-typography-body-sm oj-text-color-secondary">Long Running Txns</div>
        <div class="oj-typography-heading-sm"><oj-bind-text value="[[longRunCount]]"></oj-bind-text></div>
      </div>
    </div>

    <!-- 3. Sections that could not be collected (e.g. MDA disabled) -->
    <oj-bind-if test="[[sectionErrors().length > 0]]">
      <div class="oj-panel oj-bg-warning-10 oj-sm-margin-2x-bottom">
        <div class="oj-typography-subheading-xs">Some sections could not be collected</div>
        <oj-bind-for-each data="[[sectionErrors]]">
          <template>
            <div class="oj-typography-body-sm">
              <b><oj-bind-text value="[[$current.data.section]]"></oj-bind-text>:</b>
              <oj-bind-text value="[[$current.data.message]]"></oj-bind-text>
            </div>
          </template>
        </oj-bind-for-each>
      </div>
    </oj-bind-if>

    <!-- 4. All Sybase sections (replaces the 13 Oracle table blocks) -->
    <oj-bind-for-each data="[[sections]]">
      <template data-oj-as="sec">
        <div class="oj-panel">
          <div class="oj-panel io-color oj-margin" style="display:inline-block;">
            <span :class="[[sec.data.icon]]"></span>
            <h7><oj-bind-text value="[[' ' + sec.data.title]]"></oj-bind-text></h7>
          </div>

          <oj-bind-if test="[[sec.data.error()]]">
            <div class="oj-typography-body-sm oj-text-color-warning oj-sm-margin-2x-top">
              <oj-bind-text value="[[sec.data.error]]"></oj-bind-text>
            </div>
          </oj-bind-if>

          <oj-bind-if test="[[!sec.data.error() && sec.data.rows().length === 0]]">
            <div class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-top">No rows.</div>
          </oj-bind-if>

          <oj-bind-if test="[[sec.data.rows().length > 0]]">
            <oj-table :aria-label="[[sec.data.title]]" data="[[sec.data.dp]]"
                columns="[[sec.data.columns]]" display="grid" scroll-policy="loadAll"
                selection-mode='{"row": "single"}' style="width:100%;max-height:45vh;">
            </oj-table>
          </oj-bind-if>
        </div>
      </template>
    </oj-bind-for-each>

  </oj-bind-if>
</div>
